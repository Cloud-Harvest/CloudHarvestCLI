# Governs the themes available for users.
# A theme's structure is as follows:
# name:             The name of the theme.
#   HEADER:         The color of the header text in hex format.
#   PROMPT:         The color of the prompt text in hex format.
#   INFO:           The color of the info text in hex format.
#   WARN:           The color of the warning text in hex format.
#   ERROR:          The color of the error text in hex format.
#   FRESH_ACTIVE:   The color indicating the record has been recently updated in hex format.
#   FRESH_AGING:    The color indicating the record has not been refresh recently status in hex format.
#   FRESH_OLD:      The color indicating the record is stale in hex format.
#   FRESH_INACTIVE: The color indicating the record is inactive in hex format.
#   FRESH_UNKNOWN:  The color indicating the record's freshness is unknown in hex format.
#
# Considerations:
# - Limitations of the operator's terminal may prevent some themes from displaying correctly.
# - Limitations of YAML require that the hex code be surrounded by single quotes.

default:
  HEADER: '#4AF626'        # Bright Green
  PROMPT: '#00FFFF'        # Aqua
  INFO: '#75BFEC'          # Light Steel Blue
  WARN: '#EED202'          # Goldenrod
  ERROR: '#FF0F0F'         # Red
  FRESH_ACTIVE: '#4AF626'  # Bright Green (active)
  FRESH_AGING: '#EED202'   # Goldenrod (aging)
  FRESH_OLD: '#FF0F0F'     # Red (old)
  FRESH_INACTIVE: '#808080' # Gray (inactive)
  FRESH_UNKNOWN: '#FF00FF' # Magenta (unknown)

